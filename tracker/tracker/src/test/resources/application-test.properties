spring.datasource.url=jdbc:h2:mem:municipal_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
jwt.expiration=86400000
app.ai.base-url=http://127.0.0.1:8000
app.ai.connect-timeout=1s
app.ai.read-timeout=2s
app.priority.severity-weight=0.30
app.priority.complaint-volume-weight=0.20
app.priority.impact-weight=0.20
app.priority.deadline-risk-weight=0.15
app.priority.progress-gap-weight=0.15
app.priority.low-factor-score=25
app.priority.medium-factor-score=50
app.priority.high-factor-score=75
app.priority.critical-factor-score=100
app.priority.complaint-saturation-count=5
app.priority.deadline-risk-horizon-days=30
app.priority.medium-priority-threshold=30
app.priority.high-priority-threshold=55
app.priority.critical-priority-threshold=75
