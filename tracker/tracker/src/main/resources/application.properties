# Server Config
server.port=8080

#Database config
spring.datasource.url=jdbc:postgresql://localhost:5432/municipal_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Keep credentials, cookies, CSRF tokens, and request bodies out of framework logs.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# APP NAME
spring.application.name=live-municipal-works-tracker

# JWT Config
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# File upload config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload.root=${UPLOAD_ROOT:uploads}
app.upload.max-files=${UPLOAD_MAX_FILES:5}
app.security.login.max-failures=${LOGIN_MAX_FAILURES:5}
app.security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}
app.security.login.block-minutes=${LOGIN_BLOCK_MINUTES:15}
app.security.cookie.name=municipal_auth
app.security.cookie.secure=${AUTH_COOKIE_SECURE:false}

# Comma-separated frontend origins allowed for HTTP and WebSocket requests
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Internal AI service (browser clients must use Spring Boot endpoints)
app.ai.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
app.ai.connect-timeout=${AI_CONNECT_TIMEOUT:2s}
app.ai.read-timeout=${AI_READ_TIMEOUT:30s}

# Advisory municipal work priority score (not an official government formula)
app.priority.severity-weight=0.30
app.priority.complaint-volume-weight=0.20
app.priority.impact-weight=0.20
app.priority.deadline-risk-weight=0.15
app.priority.progress-gap-weight=0.15
app.priority.low-factor-score=25
app.priority.medium-factor-score=50
app.priority.high-factor-score=75
app.priority.critical-factor-score=100
app.priority.complaint-saturation-count=5
app.priority.deadline-risk-horizon-days=30
app.priority.medium-priority-threshold=30
app.priority.high-priority-threshold=55
app.priority.critical-priority-threshold=75

# Rule-based delay risk thresholds (percentage-point progress gap)
app.delay-risk.on-track-max-gap=10
app.delay-risk.at-risk-max-gap=25
