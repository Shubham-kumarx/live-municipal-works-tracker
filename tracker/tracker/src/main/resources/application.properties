# Server Config
server.port=8080

#Database config
spring.datasource.url=jdbc:postgresql://localhost:5432/municipal_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# APP NAME
spring.application.name=live-municipal-works-tracker

# JWT Config
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File upload config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Comma-separated frontend origins allowed for HTTP and WebSocket requests
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Internal AI service (browser clients must use Spring Boot endpoints)
app.ai.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
app.ai.connect-timeout=${AI_CONNECT_TIMEOUT:2s}
app.ai.read-timeout=${AI_READ_TIMEOUT:30s}
